{% extends "base.html" %}
{% block mainbody %}
<!-- **********************************************************************************************************************************************************
    MAIN CONTENT
    *********************************************************************************************************************************************************** -->
<section id="main-content">
    <section class="wrapper site-min-height">

    {% if error %}
        <p>{{ error }}</p>
    {% else %}
        <!-- 图表容器 -->

        <div class="charts-container">
            <div class="chart-item" id="daily_sales_chart"></div>
            <div class="chart-item" id="monthly_sales_chart"></div>
            <div class="chart-item" id="top_products_chart"></div>
            <div class="chart-item" id="category_sales_chart"></div>
            <div class="chart-item" id="origin_sales_chart"></div>
            <div class="chart-item" id="order_status_chart"></div>
        </div>
        <!-- 引入 ECharts -->
        <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

        <script>
            // 获取 Django 传递的数据
            var dailySales = {{ daily_sales|safe }};
            var topProducts = {{ top_products|safe }};
            var categorySales = {{ category_sales|safe }};
            var originSales = {{ origin_sales|safe }};
            var orderStatusCounts = {{ order_status_counts|safe }};

            // 每日销售额图表
            var dailySalesChart = echarts.init(document.getElementById('daily_sales_chart'));
            var dailySalesOption = {
                title: { text: '每日销售额' },
                tooltip: {},
                xAxis: { type: 'category', data: Object.keys(dailySales) },
                yAxis: { type: 'value' },
                series: [{ name: '销售额', type: 'line', data: Object.values(dailySales) }]
            };
            dailySalesChart.setOption(dailySalesOption);
            var monthlySales = JSON.parse('{{ monthly_sales|escapejs }}');

            var monthlySalesChart = echarts.init(document.getElementById('monthly_sales_chart'));
            var monthlySalesOption = {
                title: { text: '每月销售额' },
                tooltip: { trigger: 'axis' },
                xAxis: {
                    type: 'category',
                    data: Object.keys(monthlySales),
                },
                yAxis: { type: 'value' },
                series: [{
                    name: '销售额',
                    type: 'line',
                    data: Object.values(monthlySales),
                }]
            };
            monthlySalesChart.setOption(monthlySalesOption);
            // 热销商品图表
            var topProductsChart = echarts.init(document.getElementById('top_products_chart'));
            var topProductsOption = {
                title: { text: '热销商品' },
                tooltip: {},
                xAxis: { type: 'category', data: Object.keys(topProducts) },
                yAxis: { type: 'value' },
                series: [{ name: '销量', type: 'bar', data: Object.values(topProducts) }]
            };
            topProductsChart.setOption(topProductsOption);

            // 商品分类销量饼状图
            var categorySalesChart = echarts.init(document.getElementById('category_sales_chart'));
            var categorySalesOption = {
                title: { text: '商品分类销量', left: 'center' },
                tooltip: { trigger: 'item' },
                legend: { orient: 'vertical', left: 'left' },
                series: [{
                    name: '销量',
                    type: 'pie',
                    radius: '50%',
                    data: Object.keys(categorySales).map(key => ({
                        name: key,
                        value: categorySales[key]
                    })),
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            };
            categorySalesChart.setOption(categorySalesOption);

            // 商品产地销量饼状图
            var originSalesChart = echarts.init(document.getElementById('origin_sales_chart'));
            var originSalesOption = {
                title: { text: '商品产地销量', left: 'center' },
                tooltip: { trigger: 'item' },
                legend: { orient: 'vertical', left: 'left' },
                series: [{
                    name: '销量',
                    type: 'pie',
                    radius: '50%',
                    data: Object.keys(originSales).map(key => ({
                        name: key,
                        value: originSales[key]
                    })),
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            };
            originSalesChart.setOption(originSalesOption);
            // 订单状态统计环形图
            var orderStatusChart = echarts.init(document.getElementById('order_status_chart'));
            orderStatusChart.setOption({
                title: { text: '订单状态统计', left: 'center' },
                tooltip: { trigger: 'item' },
                legend: { orient: 'vertical', left: 'left' },
                series: [{
                    name: '订单数量',
                    type: 'pie',
                    radius: ['40%', '60%'],  // 使其成为环形图
                    data: Object.keys(orderStatusCounts).map(key => ({ name: key, value: orderStatusCounts[key] })),
                    emphasis: {
                        itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0, 0, 0, 0.5)' }
                    }
                }]
            });
        </script>
    {% endif %}
    </section>
</section>
{% endblock %}

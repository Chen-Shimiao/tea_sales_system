{% extends "base.html" %}

{% block mainbody %}
<section id="main-content">
    <section class="wrapper site-min-height">
<div class="container mt-4">
    <h4>确认删除公告：「{{ announcement.title }}」吗？</h4>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">确认删除</button>
        <a href="{% url 'announcement_list' %}" class="btn btn-secondary ms-2">取消</a>
    </form>
</div>
    </section>
</section>
{% endblock %}
